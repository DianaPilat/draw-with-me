name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --legacy-peer-deps: Babel peer conflict between plugin-react and vite-plugin-pwa,
      # and typescript-eslint's peer range predates TypeScript 7 (see README).
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve the production build
        run: npm run preview &
      - run: npx wait-on http://localhost:4173
      - name: Playwright smoke test
        run: mkdir -p shots && node tools/check-player.mjs shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: shots
